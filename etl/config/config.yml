redis:
  host: 
  port: ${REDIS_PORT}
  media_queue: "media:queue"
  notion_queue: "notion:queue"

drive:
  secrets_path: ${SECRETS_PATH}
  target_folder: "Tiktok Recipes"
  polling:
    interval: 500
llm:
  host: ${LLM_HOST}
  provider: mistral
  model: mistral
  enabled: true

whisper:
  model: base

app:
  logging: INFO
  validation:
    schema_filename: 'recipes_v1.json'
